name: Update headlines

on:
  schedule:
    - cron: "7 * * * *"      # hourly (UTC); GitHub may run scheduled jobs late
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ["web/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scalable
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated headlines
        run: |
          git config user.name "scalable-bot"
          git config user.email "scalable-bot@users.noreply.github.com"
          git add web/data data/ai_cache.json 2>/dev/null || git add web/data
          git diff --cached --quiet || git commit -m "Update headlines $(date -u +'%F %H:%M')"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
