name: Update headlines

on:
  schedule:
    # Twice an hour (UTC). GitHub delays and sometimes skips scheduled runs, so the
    # extra slot keeps the site fresh even when one is dropped.
    - cron: "11,41 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ["web/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scalable
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated headlines
        # Saving the headlines to the repo is a convenience; publishing must not depend on it.
        continue-on-error: true
        run: |
          git config user.name "scalable-bot"
          git config user.email "scalable-bot@users.noreply.github.com"
          git add web/data data/ai_cache.json 2>/dev/null || git add web/data
          git diff --cached --quiet && exit 0
          git commit -m "Update headlines $(date -u +'%F %H:%M')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || git rebase --abort
            sleep 5
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
