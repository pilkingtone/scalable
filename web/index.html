<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scalable — Top Tech &amp; Business News</title>
  <meta name="description" content="Scalable: the top tech and business stories from the best sources, all in one place.">
  <script>
    // Apply a saved theme before first paint (no flash).
    try { const t = localStorage.getItem("scalable-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="wordmark" href="#">Scal<span>able</span><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span></a>
      <div class="header-tools">
        <input type="search" id="search" placeholder="Search" aria-label="Search headlines">
        <div class="theme-switch" id="theme" role="group" aria-label="Color theme">
          <button type="button" data-theme-choice="light" aria-label="Light mode" title="Light mode"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg><span>Light</span></button>
          <button type="button" data-theme-choice="dark" aria-label="Dark mode" title="Dark mode"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Dark</span></button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div id="empty" class="banner" hidden></div>
    <div id="view"></div>
  </main>

  <footer class="wrap footer">
    <p>Scalable shows each publisher's own headlines and feed summaries and links to the original articles; it doesn't copy articles. Stories are grouped and ranked automatically by how many outlets cover them and how recently.<span id="ai-note"></span> Some sources require a subscription to read in full.</p>
    <p id="meta"></p>
    <p id="sources-note"></p>
  </footer>

  <div class="preview" id="preview" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
